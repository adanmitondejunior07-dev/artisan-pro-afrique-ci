<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artisan Pro Afrique</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen">
<div id="banner-annonce"></div><div class="max-w-6xl mx-auto p-4">
<h1 class="text-3xl font-bold text-center mt-4">ArtisanPro Afrique CI</h1>

<select id="country" onchange="updatePayment()" class="bg-[#1a1a1a] border border-[#333] rounded-lg p-3 w-full max-w-md mx-auto flex mt-6">
<option value="CI">🇨🇮 Côte d'Ivoire (Wave)</option>
<option value="SN">🇸🇳 Sénégal (Wave)</option>
<option value="ML">🇲🇱 Mali (Wave)</option>
<option value="BF">🇧🇫 Burkina Faso (Wave)</option>
<option value="BJ">🇧🇯 Bénin (Moov / MTN)</option>
<option value="TG">🇹🇬 Togo (Moov / TMoney)</option>
<option value="CM">🇨🇲 Cameroun (MTN / Orange)</option>
<option value="OTHER">🌍 Autre</option>
</select>
<p id="pay-info" class="text-xs mt-2 text-gray-400 text-center"></p>

<div class="flex justify-center mt-6">
<div class="bg-[#1a1a1a] rounded-full p-1 flex">
<button onclick="setPlan('mensuel')" id="btn-mensuel" class="px-6 py-2 rounded-full bg-white text-black font-bold">Mensuel</button>
<button onclick="setPlan('annuel')" id="btn-annuel" class="px-6 py-2 rounded-full text-gray-400">Annuel</button>
</div></div>

<div class="max-w-2xl mx-auto mt-12 bg-[#1a1a1a] rounded-2xl p-6 border border-[#333]">
<h2 class="font-bold text-orange-400">🔧 Panel Admin</h2>
<input id="annonce-titre" placeholder="Titre" class="w-full mt-3 bg-[#0a0a0a] border border-[#333] p-3 rounded-lg">
<textarea id="annonce-message" placeholder="Message pour TOUS..." class="w-full mt-3 bg-[#0a0a0a] border border-[#333] p-3 rounded-lg h-24"></textarea>
<button onclick="diffuserAnnonce()" class="w-full mt-3 bg-[#FF6B00] py-3 rounded-lg font-bold">📢 Envoyer à tous</button>
</div>
</div>

<script>
function diffuserAnnonce(){
 const t=document.getElementById('annonce-titre').value||'ArtisanPro';
 const m=document.getElementById('annonce-message').value;
 if(!m){alert('Ecris un message!');return}
 localStorage.setItem('artisanpro_annonce_globale',JSON.stringify({titre:t,message:m,date:new Date().toLocaleString()}));
 alert('✅ Notification diffusée !'); location.reload();
}
function setPlan(p){
 document.getElementById('btn-mensuel').className=p==='mensuel'?'px-6 py-2 rounded-full bg-white text-black font-bold':'px-6 py-2 rounded-full text-gray-400';
 document.getElementById('btn-annuel').className=p==='annuel'?'px-6 py-2 rounded-full bg-white text-black font-bold':'px-6 py-2 rounded-full text-gray-400';
 document.getElementById('pay-info').innerText='Plan '+p;
}
function updatePayment(){
 const c=document.getElementById('country').value;
 document.getElementById('pay-info').innerText='Pays: '+c+' - Paiement Wave/MTN';
}
try{
 const a=JSON.parse(localStorage.getItem('artisanpro_annonce_globale')||'null');
 if(a&&a.message){
  document.getElementById('banner-annonce').innerHTML=`<div style="background:#FF6B00;color:white;padding:12px;text-align:center;position:sticky;top:0;z-index:9999"><b>${a.titre}:</b> ${a.message} <span onclick="this.parentElement.remove()" style="float:right;cursor:pointer">✕</span></div>`;
 }
}catch(e){}
updatePayment();
</script>
</body></html>
