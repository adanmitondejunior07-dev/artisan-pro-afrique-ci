<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artisan Pro Afrique</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen p-4">
<div class="max-w-5xl mx-auto">
<h1 class="text-3xl font-bold">ABONNEMENTS ARTISANPRO</h1>
<p class="text-gray-400 mt-2">Formules transparentes pour artisans en Afrique.</p>
<div class="flex justify-center mt-8">
<div class="bg-[#1a1a1a] rounded-full p-1 flex gap-1">
<button onclick="setPlan('mensuel')" id="btn-mensuel" class="px-6 py-2 rounded-full bg-orange-500 font-bold">MENSUEL</button>
<button onclick="setPlan('annuel')" id="btn-annuel" class="px-6 py-2 rounded-full bg-transparent font-bold">ANNUEL</button>
</div></div>
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-8">
<div class="bg-[#1e1e1e] rounded-2xl p-6 border border-white/10">
<h3 class="font-bold">ESSENTIEL</h3>
<div class="mt-4"><span class="text-4xl font-bold" id="price-essentiel">300</span> FCFA <span id="period-essentiel" class="text-sm text-gray-400">/mois</span></div>
<a id="link-essentiel" href="https://pay.wave.com/m/M_ci_eGr2SsGnyCna/c/ci/?amount=300" target="_blank" class="mt-6 block bg-[#2a2a2a] text-center py-3 rounded-full font-bold">CHOISIR CETTE FORMULE</a>
</div>
<div class="bg-[#1e1e1e] rounded-2xl p-6 border-2 border-orange-500 relative">
<div class="absolute -top-3 left-1/2 -translate-x-1/2 bg-orange-500 text-xs font-bold px-4 py-1 rounded-full">RECOMMANDE</div>
<h3 class="font-bold">PRO</h3>
<div class="mt-4"><span class="text-4xl font-bold" id="price-pro">700</span> FCFA <span id="period-pro" class="text-sm text-gray-400">/mois</span></div>
<a id="link-pro" href="https://pay.wave.com/m/M_ci_eGr2SsGnyCna/c/ci/?amount=700" target="_blank" class="mt-6 block bg-orange-500 text-center py-3 rounded-full font-bold">CHOISIR CETTE FORMULE</a>
</div>
<div class="bg-[#1e1e1e] rounded-2xl p-6 border border-white/10">
<h3 class="font-bold">PREMIUM</h3>
<div class="mt-4"><span class="text-4xl font-bold" id="price-premium">1000</span> FCFA <span id="period-premium" class="text-sm text-gray-400">/mois</span></div>
<a id="link-premium" href="https://pay.wave.com/m/M_ci_eGr2SsGnyCna/c/ci/?amount=1000" target="_blank" class="mt-6 block bg-[#2a2a2a] text-center py-3 rounded-full font-bold">CHOISIR CETTE FORMULE</a>
</div>
</div>
<p class="text-center text-xs text-gray-500 mt-10">Paiements FCFA via Wave Business - Activation instantanée</p>
</div>
<script>
const links={mensuel:{essentiel:"https://pay.wave.com/m/M_ci_eGr2SsGnyCna/c/ci/?amount=300",pro:"https://pay.wave.com/m/M_ci_eGr2SsGnyCna/c/ci/?amount=700",premium:"https://pay.wave.com/m/M_ci_eGr2SsGnyCna/c/ci/?amount=1000"},annuel:{essentiel:"https://pay.wave.com/m/M_ci_eGr2SsGnyCna/c/ci/?amount=4000",pro:"https://pay.wave.com/m/M_ci_eGr2SsGnyCna/c/ci/?amount=8000",premium:"https://pay.wave.com/m/M_ci_eGr2SsGnyCna/c/ci/?amount=11000"}};
function setPlan(p){
document.getElementById('btn-mensuel').className=p==='mensuel'?'px-6 py-2 rounded-full bg-orange-500 font-bold':'px-6 py-2 rounded-full bg-transparent font-bold';
document.getElementById('btn-annuel').className=p==='annuel'?'px-6 py-2 rounded-full bg-orange-500 font-bold':'px-6 py-2 rounded-full bg-transparent font-bold';
if(p==='mensuel'){priceEss='300';pricePro='700';pricePrem='1000';per='/mois';}else{priceEss='4 000';pricePro='8 000';pricePrem='11 000';per='/an';}
document.getElementById('price-essentiel').innerText=priceEss;document.getElementById('price-pro').innerText=pricePro;document.getElementById('price-premium').innerText=pricePrem;
document.getElementById('period-essentiel').innerText=per;document.getElementById('period-pro').innerText=per;document.getElementById('period-premium').innerText=per;
document.getElementById('link-essentiel').href=p==='mensuel'?links.mensuel.essentiel:links.annuel.essentiel;
document.getElementById('link-pro').href=p==='mensuel'?links.mensuel.pro:links.annuel.pro;
document.getElementById('link-premium').href=p==='mensuel'?links.mensuel.premium:links.annuel.premium;
}
</script>
</body>
</html>
