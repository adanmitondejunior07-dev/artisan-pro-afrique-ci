<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artisan Pro Afrique CI</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen">
<div id="banner-annonce"></div>
<div class="max-w-md mx-auto p-4 pb-20">
<h1 class="text-2xl font-bold text-center mt-6">ArtisanPro Afrique CI</h1>

<select id="country" class="bg-[#1a1a1a] border border-[#333] rounded-xl p-4 w-full mt-6">
<option value="CI">🇨🇮 Côte d'Ivoire (Wave)</option>
<option value="SN">🇸🇳 Sénégal (Wave)</option>
<option value="ML">🇲🇱 Mali (Wave)</option>
<option value="BF">🇧🇫 Burkina Faso (Wave)</option>
<option value="BJ">🇧🇯 Bénin</option>
<option value="TG">🇹🇬 Togo</option>
<option value="CM">🇨🇲 Cameroun</option>
</select>

<div class="flex justify-center mt-6">
<div class="bg-[#1a1a1a] rounded-full p-1 flex">
<button onclick="setPlan('mensuel')" id="btn-m" class="px-8 py-2.5 rounded-full bg-white text-black font-bold">Mensuel</button>
<button onclick="setPlan('annuel')" id="btn-a" class="px-8 py-2.5 rounded-full text-gray-400">Annuel</button>
</div></div>

<div class="space-y-4 mt-8">
<div class="bg-[#1a1a1a] rounded-2xl p-5 border border-[#333]">
<h3 class="font-bold">Essentiel</h3>
<p id="p-ess" class="text-3xl font-bold mt-3">300 FCFA</p>
<p class="text-xs text-gray-400">par mois</p>
<button onclick="subscribe('Essentiel',300)" class="w-full mt-4 bg-[#333] py-3 rounded-xl font-bold">Choisir Essentiel - 300F</button>
</div>

<div class="bg-[#FF6B00] rounded-2xl p-5 border-2 border-white">
<h3 class="font-bold">Pro ⭐</h3>
<p id="p-pro" class="text-3xl font-bold mt-3">700 FCFA</p>
<p class="text-xs">par mois - Populaire</p>
<button onclick="subscribe('Pro',700)" class="w-full mt-4 bg-white text-black py-3 rounded-xl font-bold">S'abonner Pro - 700F</button>
</div>

<div class="bg-[#1a1a1a] rounded-2xl p-5 border border-[#333]">
<h3 class="font-bold">Premium 👑</h3>
<p id="p-prem" class="text-3xl font-bold mt-3">1000 FCFA</p>
<p class="text-xs text-gray-400">par mois - VIP</p>
<button onclick="subscribe('Premium',1000)" class="w-full mt-4 bg-[#333] py-3 rounded-xl font-bold">Choisir Premium - 1000F</button>
</div></div>

<div class="mt-10 bg-[#1a1a1a] rounded-2xl p-5 border border-[#333]">
<h2 class="font-bold text-orange-400 text-sm">🔧 Panel Admin</h2>
<input id="annonce-titre" placeholder="Titre" class="w-full mt-3 bg-[#0a0a0a] border border-[#333] p-3 rounded-xl text-sm">
<textarea id="annonce-message" placeholder="Message pour TOUS..." class="w-full mt-3 bg-[#0a0a0a] border border-[#333] p-3 rounded-xl text-sm h-20"></textarea>
<button onclick="diffuserAnnonce()" class="w-full mt-3 bg-[#FF6B00] py-3 rounded-xl font-bold text-sm">📢 Envoyer à tous</button>
</div></div>

<script>
let plan='mensuel';
const WHATSAPP_NUMBER='225503444508';

function setPlan(p){plan=p;
document.getElementById('btn-m').className=p==='mensuel'?'px-8 py-2.5 rounded-full bg-white text-black font-bold':'px-8 py-2.5 rounded-full text-gray-400';
document.getElementById('btn-a').className=p==='annuel'?'px-8 py-2.5 rounded-full bg-white text-black font-bold':'px-8 py-2.5 rounded-full text-gray-400';
document.getElementById('p-ess').innerText=p==='mensuel'?'300 FCFA':'4.000 FCFA/an';
document.getElementById('p-pro').innerText=p==='mensuel'?'700 FCFA':'8.000 FCFA/an';
document.getElementById('p-prem').innerText=p==='mensuel'?'1.000 FCFA':'11.000 FCFA/an';
