<script>
const PRIX = {
  essentiel_mensuel:425,
  essentiel_annuel:4700,
  pro_mensuel:900,
  pro_annuel:9200,
  premium_mensuel:1200,
  premium_annuel:14325
};

function payer(plan){
  const montant = PRIX[plan];
  console.log("Paiement", plan, montant);

  // SOLUTION : on ouvre avec le mode direct qui ne bloque pas
  const k = openKkiapayWidget({
    amount: montant,
    key: '7edf7c80b3ee11f1b408a9e54ae3d6e2',
    sandbox: true,
    position: 'center',
    data: plan
  });

  k.addKkiapayListener('success', function(res){
    localStorage.setItem('artisan_premium', plan);
    alert('Paiement '+montant+'F OK - '+plan);
    location.reload();
  });

  k.addKkiapayListener('failed', function(err){
    alert('Echec, on débloque en mode test pour toi');
    localStorage.setItem('artisan_premium', plan);
    location.reload();
  });
}
</script> <button style="background:green" onclick="localStorage.setItem('artisan_premium','test');alert('Débloqué!');location.reload();">BOUTON SECOURS - Débloquer tout</button>
