<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ArtisanPro</title>
<style>body{font-family:Arial;background:#f2f2f2;padding:20px;text-align:center}.card{background:white;padding:20px;border-radius:15px}button{width:100%;padding:15px;margin:8px 0;border:none;border-radius:10px;font-weight:bold;color:white;background:#0d6efd}.green{background:#198754}</style></head>
<body><h2>ArtisanPro CI - MODE TEST</h2><div class="card">
<button onclick="pay('essentiel_mensuel')">Essentiel 425F/mois - Activer</button>
<button onclick="pay('pro_mensuel')">Pro 900F/mois - Activer</button>
<button onclick="pay('premium_annuel')">Premium 14325F/an - Activer</button>
<p id="s"></p></div>
<script>
function pay(p){localStorage.setItem('artisan_premium',p);document.getElementById('s').innerText='Plan actif: '+p+' (en attente Kkiapay)';alert('Activé en mode test! Accès fondateur/artisan débloqué');location.reload();}
let cur=localStorage.getItem('artisan_premium');if(cur)document.getElementById('s').innerText='ACTIF: '+cur;
</script></body></html>
